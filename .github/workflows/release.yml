name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Resolve version from tag
        id: meta
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not contain a valid version." >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "zip_name=tmdb-boxsets_$VERSION.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          dotnet build -c Release --warnaserror \
            -p:AssemblyVersion=${{ steps.meta.outputs.version }} \
            -p:FileVersion=${{ steps.meta.outputs.version }}

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # The DLL must sit at the zip root: Jellyfin extracts the archive
          # straight into the plugin directory.
          zip -j "artifacts/${{ steps.meta.outputs.zip_name }}" \
            Jellyfin.Plugin.TmdbBoxSets/bin/Release/net9.0/Jellyfin.Plugin.TmdbBoxSets.dll
          unzip -l "artifacts/${{ steps.meta.outputs.zip_name }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "artifacts/${{ steps.meta.outputs.zip_name }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Update manifest on main
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.meta.outputs.zip_name }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          git checkout main
          python3 scripts/update_manifest.py \
            --zip "artifacts/${{ steps.meta.outputs.zip_name }}" \
            --version "${{ steps.meta.outputs.version }}" \
            --source-url "$SOURCE_URL" \
            --changelog "Release $GITHUB_REF_NAME"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json build.yaml
          if git diff --cached --quiet; then
            echo "Manifest already up to date."
          else
            git commit -m "Publish ${{ steps.meta.outputs.version }} to plugin manifest"
            git push origin main
          fi
