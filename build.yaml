category: "MoviesAndShows"
license: "GPL-3.0-only"
overview: "Automatically group movies into box sets by their TMDB collection."
description: >
  Groups movies by the TMDB collection ID that Jellyfin's own metadata refresh
  already stores on each movie, then creates and maintains a matching box set.
  Requires no TMDB API key of its own: the box set is tagged with the TMDB
  collection ID so Jellyfin's built-in provider supplies the name, overview and
  artwork.
artifacts:
  - "Jellyfin.Plugin.TmdbBoxSets.dll"
